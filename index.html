<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mayaimi">
<meta name="theme-color" content="#0b1220">
<title>Mayaimi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; position: fixed;
    overscroll-behavior: none;
    background: #0b1220;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; touch-action: none; }
  #rotateHint {
    display: none; position: fixed; inset: 0; z-index: 10;
    background: rgba(11, 18, 32, 0.92); color: #e8eef7;
    align-items: center; justify-content: center; text-align: center;
    font-family: -apple-system, system-ui, sans-serif; font-size: 18px; padding: 24px;
  }
  @media (orientation: portrait) { #rotateHint { display: flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="rotateHint">🔄<br><br>Rotate your phone<br>to play Mayaimi in landscape.</div>
<script>
// Automated-test bypass: ?uitest hides the rotate hint so the game can be
// exercised in any viewport. Invisible in normal use.
if (new URLSearchParams(location.search).has('uitest')) {
  document.getElementById('rotateHint').style.display = 'none';
}
</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
